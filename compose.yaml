# TODO: Demo Postgres for ledger. Not the BOG-16 infra profile.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
